<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Assistant</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>BS Assistant</h1>
        <p>Бот-помощник по игре Brawl Stars</p>
    </div>

    <div class="buttons">

        <button class="btn red">🥊 Бойцы</button>
        <button class="btn dark">🎉 События</button>

        <button class="btn green play">
            ▶ Играть
        </button>

        <button class="btn dark">🎫 Brawl Pass</button>
        <button class="btn dark">👥 Команды</button>
        <button class="btn dark">🏆 Клубы</button>

        <button class="btn green">
            💚 Спонсировать
        </button>

        <button class="btn dark">🛒 Магазин</button>
        <button class="btn dark">⚡ Баффы</button>
        <button class="btn dark">🤝 Друзья</button>

        <button class="btn dark">
            👤 Профиль
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
