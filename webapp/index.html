<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Assistant</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">

    <div class="profile">

        <div class="avatar" id="avatar">👤</div>

        <div>
            <h2 id="username">Игрок</h2>
            <p>BS Assistant</p>
        </div>

    </div>

    <div class="grid">

        <button class="card red">🥊<br>Бойцы</button>

        <button class="card">🎯<br>События</button>

        <button class="card green big">▶<br>Играть</button>

        <button class="card">🎫<br>Brawl Pass</button>

        <button class="card">👥<br>Команды</button>

        <button class="card">🛡<br>Клубы</button>

        <button class="card green">💚<br>Спонсировать</button>

        <button class="card">🛒<br>Магазин</button>

        <button class="card">⚡<br>Баффы</button>

        <button class="card">🤝<br>Друзья</button>

        <button class="card">👤<br>Профиль</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
